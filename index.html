<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14283b">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<style>[hidden]{display:none!important}html,body{margin:0}body{background:var(--bg)}</style>
<title>نظام الديون</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: one white ledger card on a pale ground. Navy-teal masthead with the coin mark,
   summary tiles, then a sortable client table whose rows tint by how late the debt is. */
:root{
  --bg:#e7edf2; --surface:#ffffff; --surface2:#f4f7fa; --ink:#13283b; --muted:#64788a; --line:#dbe4ec;
  --hero1:#11303f; --hero2:#1d4b5c; --hero-ink:#ffffff; --head:#14283b; --head-ink:#ffffff;
  --gold:#e0a82e; --gold-ink:#3a2a00; --wa:#1f7d4e; --wa-ink:#ffffff;
  --good:#1d7a4b; --good-bg:#e3f3ea; --warn:#8a5a00; --warn-bg:#fbebb9; --bad:#a3352b; --bad-bg:#fbe4e1;
  --rem:#9a4a14;
  --row-warn:#fdf5dc; --row-bad:#fdecea; --row-good:#edf8f2;
  --shadow:0 10px 30px rgba(19,40,59,.12);
  --font:"Tajawal","Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b131b; --surface:#142130; --surface2:#1a2b3c; --ink:#e6eef5; --muted:#93a6b8; --line:#26394d;
    --hero1:#0e2430; --hero2:#17414f; --head:#0d1a27;
    --good:#5fcb92; --good-bg:#133323; --warn:#ecc062; --warn-bg:#3d300c; --bad:#f08e82; --bad-bg:#3d1b18;
    --rem:#f0a066;
    --row-warn:#231f12; --row-bad:#2a1a1a; --row-good:#12261c;
    --shadow:0 10px 30px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b131b; --surface:#142130; --surface2:#1a2b3c; --ink:#e6eef5; --muted:#93a6b8; --line:#26394d;
  --hero1:#0e2430; --hero2:#17414f; --head:#0d1a27;
  --good:#5fcb92; --good-bg:#133323; --warn:#ecc062; --warn-bg:#3d300c; --bad:#f08e82; --bad-bg:#3d1b18;
  --rem:#f0a066;
  --row-warn:#231f12; --row-bad:#2a1a1a; --row-good:#12261c;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;direction:rtl;
  padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #4aa3c4;outline-offset:2px}
.app{max-width:1180px;margin-inline:auto}
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}

/* masthead */
.hero{background:linear-gradient(120deg,var(--hero1),var(--hero2));color:var(--hero-ink);padding:22px 28px;display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand svg{flex:none;width:56px;height:56px}
.brand h1{margin:0;font-size:28px;font-weight:800;line-height:1.2}
.brand p{margin:2px 0 0;font-size:13px;opacity:.78}
#sync{display:inline-block;font-size:12px;opacity:.7;min-height:18px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-inline-start:auto}
.hbtn{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:var(--hero-ink);padding:7px 14px;border-radius:9px;font-size:13.5px;font-weight:500;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.18)}
.hbtn.primary{background:#fff;color:#12303f;border-color:#fff;font-weight:700}
.hbtn.primary:hover{background:#e9f2f6}
.hbtn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700}
.hbtn.wa{background:var(--wa);color:var(--wa-ink);border-color:var(--wa);font-weight:700}

.body{padding:22px 28px 28px}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.stat{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.stat span{display:block;font-size:12.5px;color:var(--muted)}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.3;font-variant-numeric:tabular-nums}
.stat.debt b{color:var(--bad)} .stat.got b{color:var(--good)} .stat.rem b{color:var(--rem)} .stat.late b{color:var(--bad)}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;margin:26px 0 14px}
.bar h2{margin:0;font-size:22px;font-weight:800;margin-inline-end:auto}
.bar label.f{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.inp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 12px;min-width:0;width:100%}
.inp:focus{border-color:#4aa3c4}
.bar .inp.q{width:210px}
.bar .inp.n{width:70px;text-align:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:10px;font-size:13.5px;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.solid{background:var(--head);color:var(--head-ink);border-color:var(--head);font-weight:700}
.btn.danger{color:var(--bad)}
.btn.good{background:var(--wa);color:#fff;border-color:var(--wa);font-weight:700}

.tblwrap{border:1px solid var(--line);border-radius:14px;overflow:hidden}
table.tbl{width:100%;border-collapse:collapse}
.tbl thead th{background:var(--head);color:var(--head-ink);text-align:right;font-weight:700;font-size:13.5px;padding:14px 12px;white-space:nowrap}
.tbl thead th.num{text-align:center}
.sort{all:unset;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.sort:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:4px}
.sort i{font-style:normal;font-size:10px;opacity:.45}
th[aria-sort="ascending"] .sort i,th[aria-sort="descending"] .sort i{opacity:1}
.tbl td{padding:12px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:first-child td{border-top:0}

.no{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.c-name{font-size:17px;font-weight:800}
.c-name small{display:block;font-size:12px;font-weight:400;color:var(--muted);direction:ltr;text-align:right}
td.num{text-align:center;font-weight:700;font-size:15.5px;font-variant-numeric:tabular-nums}
td.num.debt{color:var(--bad)} td.num.got{color:var(--good)}
td.cen{text-align:center}
.chip{display:inline-block;padding:0;font-weight:800;font-variant-numeric:tabular-nums}
.chip-rem{background:none;color:var(--ink)} .r-warn .chip-rem{color:#c08a00} .r-late .chip-rem{color:#d32f23}
.chip-ok{background:none;color:#1b9a55}
.pill{display:inline-block;padding:0;font-size:14px;font-weight:800;background:none;color:var(--muted);border:0}
.pill.p-warn{color:#c08a00}
.pill.p-late{color:#d32f23}
.pill.p-paid{color:#1b9a55}
.c-note{width:30%}
.c-note textarea{width:100%;min-height:58px;resize:vertical;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13.5px}
.c-act{white-space:nowrap}
.c-act .mini{display:block;width:62px;margin:0 auto 6px;padding:3px 0;border-radius:7px;font-size:12px;font-weight:700;border:1px solid #b9cde0;background:#e8f0f9;color:#1d4a7a}
.c-act .mini:last-child{margin-bottom:0}
.c-act .mini.danger{border-color:#e6bcb6;background:#fbe9e6;color:#a3352b}
:root[data-theme="dark"] .c-act .mini{background:#173044;color:#9cc8ee;border-color:#27506f}
:root[data-theme="dark"] .c-act .mini.danger{background:#3a1c19;color:#f19a90;border-color:#6a3430}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .c-act .mini{background:#173044;color:#9cc8ee;border-color:#27506f}
  :root:not([data-theme="light"]) .c-act .mini.danger{background:#3a1c19;color:#f19a90;border-color:#6a3430}
}
.empty{text-align:center;padding:44px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.empty .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.banner{background:var(--warn-bg);color:var(--warn);padding:10px 16px;border-radius:10px;margin-bottom:14px;font-size:13.5px}

/* modals */
.overlay{position:fixed;inset:0;background:rgba(8,18,28,.55);display:flex;align-items:center;justify-content:center;
  padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));z-index:50}
.modal{background:var(--surface);color:var(--ink);border-radius:18px;width:100%;max-width:520px;max-height:100%;overflow:auto;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:16px}
.modal.wide{max-width:760px}
.mhead{display:flex;align-items:flex-start;gap:12px}
.mhead h3{margin:0;font-size:21px;font-weight:800}
.mhead small{display:block;color:var(--muted);direction:ltr;text-align:right}
.x{margin-inline-start:auto;border:0;background:var(--surface2);width:34px;height:34px;border-radius:999px;font-size:20px;line-height:1;flex:none}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h4{margin:0;font-size:14px;color:var(--muted);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.field.full{grid-column:1/-1}
.mini-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mini-stats div{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mini-stats span{display:block;font-size:12px;color:var(--muted)}
.mini-stats b{font-size:18px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;align-self:flex-start}
.seg label{padding:6px 16px;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--muted)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:var(--head-ink)}
.seg label:has(input:checked){background:var(--head);color:var(--head-ink)}
.seg label:has(input:focus-visible){outline:2px solid #4aa3c4;outline-offset:-2px}
.mtbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;max-height:340px}
.mtbl{width:100%;border-collapse:collapse;font-size:13.5px}
.mtbl th{background:var(--surface2);text-align:right;padding:8px 10px;font-weight:700;color:var(--muted);white-space:nowrap;position:sticky;top:0}
.mtbl td{padding:8px 10px;border-top:1px solid var(--line)}
.mtbl td.m{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.t-pay{color:var(--good)} .t-debt{color:var(--bad)}
.foot{display:flex;flex-wrap:wrap;gap:8px}
.foot .sp{margin-inline-start:auto}
.err{color:var(--bad);font-size:13px;min-height:19px}
.msgbox{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;white-space:pre-wrap}
.wlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.wrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.wrow:first-child{border-top:0}
.wrow .n{font-weight:800;min-width:0;flex:1 1 120px}
.wrow .n small{display:block;color:var(--muted);font-weight:400;font-size:12px}
a.btn{text-decoration:none;display:inline-block}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--head);color:#fff;padding:10px 20px;border-radius:12px;font-size:14px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1}

.hbtn[hidden],#lock[hidden],.field[hidden],form[hidden]{display:none}
.locked .app,.locked #layer{display:none}
#lock{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:80;padding:16px}
.lockbox{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:30px 28px;width:100%;max-width:340px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.lockbox h2{margin:0;font-size:24px;font-weight:800}
.lockbox p{margin:0;color:var(--muted)}
.lockbox form{display:flex;gap:8px;width:100%}
.lockbox form .inp{text-align:center;letter-spacing:.3em;font-size:18px}
.lockbox small{color:var(--muted);font-size:12px}
.stat em{display:block;font-style:normal;font-size:15px;font-weight:700;opacity:.85;font-variant-numeric:tabular-nums}
small.due{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
#toast.act{pointer-events:auto;display:flex;gap:14px;align-items:center}
#toast .tact{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:2px 12px;font-weight:700}
select.inp{appearance:auto}

.menu{position:fixed;z-index:60;min-width:230px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column}
.menu[hidden]{display:none}
.menu button{border:0;background:none;text-align:right;padding:10px 14px;border-radius:9px;font-size:14.5px}
.menu button:hover,.menu button:focus-visible{background:var(--surface2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px;width:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.fchip{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:999px;font-size:13.5px;font-weight:500}
.fchip b{display:inline-block;min-width:20px;margin-inline-start:4px;padding:0 6px;border-radius:999px;background:var(--surface2);font-size:12px;text-align:center;font-variant-numeric:tabular-nums}
.fchip.on{background:var(--head);color:var(--head-ink);border-color:var(--head)}
.fchip.on b{background:rgba(255,255,255,.2)}
details.adv{margin-inline-start:auto;font-size:13px;color:var(--muted)}
details.adv summary{cursor:pointer;padding:6px 4px}
.advbody{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 0}
.advbody .inp.n{width:70px;text-align:center}
.advbody .f{display:flex;align-items:center;gap:6px}
button.stat{font:inherit;color:inherit;text-align:right;cursor:pointer;width:100%}
button.stat:hover{border-color:var(--bad)}
.namebtn{all:unset;cursor:pointer;font-weight:800;font-size:17px}
.namebtn:hover{text-decoration:underline}
.namebtn:focus-visible{outline:2px solid #4aa3c4;outline-offset:2px;border-radius:4px}
.c-act .mini.pay{background:var(--wa) !important;border-color:var(--wa) !important;color:#fff !important}
.c-act .mini.debt{background:var(--bad-bg) !important;border-color:var(--bad) !important;color:var(--bad) !important}
.c-act .mini[disabled]{opacity:.4;cursor:default}
.c-act .mini.del{background:transparent !important;border-color:var(--bad) !important;color:var(--bad) !important}
.c-note textarea{height:42px;min-height:42px;transition:height .15s}
.c-note textarea:focus{height:96px}
.big{font-size:22px;font-weight:800;text-align:center;padding:12px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.fab{display:none;position:fixed;z-index:40;left:max(16px,env(safe-area-inset-left,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));background:var(--wa);color:#fff;border:0;border-radius:999px;padding:14px 22px;font-size:17px;font-weight:800;box-shadow:0 8px 22px rgba(0,0,0,.3)}
.locked .fab{display:none !important}
details.edit{border:1px solid var(--line);border-radius:12px;padding:4px 14px}
details.edit summary{cursor:pointer;padding:8px 0;font-weight:700;color:var(--muted);font-size:14px}
details.edit[open] summary{margin-bottom:6px}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

@media (max-width:980px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){
  .hero{padding:18px 16px}.body{padding:16px}
  #bAdd{display:none}.fabv{left:auto;right:max(16px,env(safe-area-inset-right,0px));padding:14px 18px;background:var(--hero2)}.fab{display:block}body{padding-bottom:92px}
  #toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .c-note textarea{height:46px}
  .actions{margin-inline-start:0}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bar .inp.q{width:100%} .bar h2{width:100%}
  .tbl thead{display:none}
  .tbl,.tbl tbody{display:block}
  .tbl tr{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;padding:14px;border-top:1px solid var(--line)}
  .tbl tbody tr:first-child{border-top:0}
  .tbl td{display:block;padding:0;border:0;text-align:right !important}
  .tbl td[data-label]::before{content:attr(data-label);display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-bottom:2px}
  .tbl td.c-no{display:none}
  .tbl td.c-name,.tbl td.c-note{grid-column:1/-1}
  .tbl td.c-name::before{display:none !important}
  .c-note{width:auto}
  .tbl td.c-act{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
  .c-act .mini{width:auto;flex:1;margin:0;padding:8px 0}
  .c-act .mini.pay{flex:1 1 100%}
  .tbl td.empty-cell{grid-column:1/-1}
  .tbl td.empty-cell::before{display:none !important}
}
@media (max-width:480px){.stat b{font-size:21px}.brand h1{font-size:23px}.grid2,.grid3{grid-template-columns:1fr}.mini-stats{grid-template-columns:1fr 1fr}.modal{padding:16px}}

/* tabs, alerts, hidden due fields */
#bBell{position:relative;font-size:18px;padding:8px 12px}.bdg{position:absolute;top:-6px;inset-inline-start:-6px;background:#e6a700;color:#2a2000;border-radius:99px;min-width:20px;height:20px;padding:0 5px;font:800 12px/20px Tajawal,sans-serif;text-align:center}.bdg.red{background:#d9382c;color:#fff}
.tabs2{display:flex;gap:8px;margin:0 0 14px}
.tabs2 button{flex:1;padding:11px 12px;border:1.5px solid var(--line,#dbe4ec);background:var(--surface,#fff);color:inherit;border-radius:12px;font:700 15px Tajawal,sans-serif;cursor:pointer}
.tabs2 button b{background:rgba(127,127,127,.18);border-radius:99px;padding:1px 8px;margin-inline-start:4px;font-size:13px}
.tabs2 button.on{background:var(--hero2,#14283b);color:#fff;border-color:transparent}
.al{border:1.5px solid #e6c14a;background:#fff8e1;border-radius:14px;margin:0 0 14px;color:#3b2f06}
.al summary{padding:11px 14px;font-weight:800;cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center}
.al summary::-webkit-details-marker{display:none}
.alc{background:#14283b;color:#fff;border-radius:99px;padding:1px 9px;font-size:13px}
.alr{background:#c0392b;color:#fff;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:700}
.alist{padding:0}
.agrp{font-weight:800;font-size:13px;margin:8px 4px 4px;opacity:.8}
.arow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;margin-bottom:6px;cursor:pointer;border:1px solid transparent}
.a-yel{background:#fff0b3;border-color:#e6c14a}
.a-red{background:#fbd5d0;border-color:#d9534f}
.ad{min-width:46px;text-align:center;font:800 20px Tajawal,sans-serif;line-height:1}
.ad small{display:block;font-size:11px;font-weight:600}
.a-red .ad{color:#a3231a}.a-yel .ad{color:#7a5a00}

<script>
(function(){

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return Number(n||0).toLocaleString('en-US')}
function fm(n,cur){return (cur==='USD'?'$':'')+money(n)}
function fmFull(n,cur){return cur==='USD'?money(n)+' دولار':money(n)+' دينار عراقي'}
function pad(n){return String(n).padStart(2,'0')}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return dstr(new Date())}
function parseD(s){var p=String(s).split('-').map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1)}
function addDays(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return dstr(d)}
function diffDays(a,b){return Math.round((parseD(a)-parseD(b))/864e5)}
function showD(s){if(!s)return '—';var p=String(s).split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function timeOf(x){var t=Number(x&&x.createdAt);if(!(t>1e12))return '';var d=new Date(t),h=d.getHours(),m=d.getMinutes();return ((h%12)||12)+':'+(m<10?'0':'')+m+' '+(h<12?'ص':'م')}
function dtText(x){var t=timeOf(x);return showD(x.date)+(t?'  '+t:'')}

  var s=toDigits(v).replace(/[٬,،\s]/g,'').replace('٫','.');
  if(!s)return NaN; var n=Number(s); return isFinite(n)?Math.round(n):NaN;
}
function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s||'')}

/* ---------- model ---------- */
function normClient(d){
  if(!d||typeof d.name!=='string'||!d.name)return null;
  return {no:Number(d.no)||0,name:d.name,phone:String(d.phone||''),cur:d.cur==='USD'?'USD':'IQD',note:String(d.note||''),kind:d.kind==='supplier'?'supplier':'customer',del:Number(d.del)||0,createdAt:Number(d.createdAt)||0};

  return {cid:d.cid,type:d.type==='payment'?'payment':'debt',amount:a,date:validDate(d.date)?d.date:today(),due:validDate(d.due)?d.due:'',note:String(d.note||''),createdAt:Number(d.createdAt)||0};
}
function normSettings(d){
  var o=Object.assign({pinHash:'',pinSalt:''},DEFAULTS);
  if(!d||typeof d!=='object')return o;
  if(!(Number(d.lateDays)===31&&Number(d.warnDays)===7))['lateDays','warnDays'].forEach(function(k){var v=Number(d[k]);if(isFinite(v)&&v>=0)o[k]=Math.round(v)});
  if(d.dueMode==='days')o.dueMode='days';
  var sh=String(d.shop==null?'':d.shop).trim().slice(0,60);if(sh)o.shop=sh;
  var tv=Number(d.termDays);if(isFinite(tv)&&tv>=0)o.termDays=(tv===30?31:Math.round(tv));
  if(typeof d.country==='string'&&d.country.replace(/\D/g,''))o.country=d.country.replace(/\D/g,'');
  if(typeof d.template==='string'&&d.template.trim())o.template=d.template;
  if(typeof d.pinHash==='string'&&typeof d.pinSalt==='string'){o.pinHash=d.pinHash;o.pinSalt=d.pinSalt}
  return o;
}
function rebuild(){
  var by={};
  Object.keys(tdocs).forEach(function(id){var t=tdocs[id];(by[t.cid]=by[t.cid]||[]).push(Object.assign({id:id},t))});
  var allc=Object.keys(cdocs).map(function(id){
    var c=cdocs[id],txs=(by[id]||[]).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.createdAt-b.createdAt});
    return {id:id,no:c.no,name:c.name,phone:c.phone,cur:c.cur,note:c.note,kind:c.kind,del:c.del,createdAt:c.createdAt,txs:txs};
  });
  state.clients=allc.filter(function(c){return !c.del});state.trash=allc.filter(function(c){return c.del}).sort(function(a,b){return b.del-a.del});

/* payments settle the oldest debt first; each debt falls due on the 1st of the month after its date (or termDays after it), and the delay counts the days after that */
function dueOf(date){
  if(S().dueMode==='days')return addDays(date,S().termDays);
  var p=String(date).split('-').map(Number),y=p[0],m=p[1]+1;if(m>12){m=1;y++}
  return y+'-'+pad(m)+'-01';
}
function dueLabel(){return S().dueMode==='days'?'بعد مهلة '+S().termDays+' يوماً':'الاستحقاق أول كل شهر'}
function calc(c){
  var debts=[],t=0,p=0,ct=0,cp=0;
  c.txs.forEach(function(x){
    if(x.type==='payment'){p+=x.amount;cp+=x.amount}
    else{t+=x.amount;ct+=x.amount;debts.push({amt:x.amount,due:dueOf(x.date)})}
    if(ct-cp<=0){ct=0;cp=0}
  });
  debts.sort(function(a,b){return a.due<b.due?-1:a.due>b.due?1:0});
  var left=p,due='';
  for(var i=0;i<debts.length;i++){if(left>=debts[i].amt)left-=debts[i].amt;else{due=debts[i].due;break}}
  var rem=t-p,delay=0;
  if(rem>0&&due)delay=Math.max(0,diffDays(today(),due));
  var st=rem<=0?'paid':delay>=S().lateDays?'late':delay>=S().warnDays?'warn':'ok';
  return {total:t,paid:p,ct:ct,cp:cp,rem:rem,delay:delay,due:rem>0?due:'',status:st};
}

/* ---------- storage: one document per client and per transaction ---------- */
var overlay={}, pathChain={}, active=0, waiters=[], pending=0, localTimer=null;
function setSync(kind){
  var el=$('#sync');
  el.textContent=kind==='saving'?'جارٍ الحفظ…':kind==='saved'?(mode==='db'?'تم الحفظ':'تم الحفظ على هذا الجهاز'):kind==='error'?'تعذر الحفظ':'';
}
function saveLocal(){
  clearTimeout(localTimer);
  localTimer=setTimeout(function(){
    try{localStorage.setItem('ledger-v2',JSON.stringify({c:cdocs,t:tdocs,s:settings}));setSync('saved')}catch(e){setSync('error')}
  },60);
}
function limit(fn){
  return new Promise(function(res,rej){
    function run(){active++;Promise.resolve().then(fn).then(res,rej).then(function(){active--;var w=waiters.shift();if(w)w()})}
    if(active<6)run();else waiters.push(run);
  });
}
function applyOne(path,o){
  var p=path.split('/'),map=p[0]==='clients'?cdocs:p[0]==='txs'?tdocs:null;
  if(!map)return;
  if(o.del)delete map[p[1]];else map[p[1]]=o.data;
}
function applyOverlay(){Object.keys(overlay).forEach(function(p){applyOne(p,overlay[p])})}
function writeError(e){
  var code=e&&e.code;
  toast(code==='invalid_argument'?'ليس لديك صلاحية التعديل على هذه البيانات':code==='quota_exceeded'?'امتلأت مساحة التخزين، احذف بعض البيانات':'تعذر حفظ التغييرات، حاول مرة أخرى');
}
/* write one document; the change shows at once and is kept until the store confirms it */
function writeDoc(path,del,data){
  var token={del:del,data:data};
  overlay[path]=token;applyOne(path,token);
  if(mode!=='db'){delete overlay[path];saveLocal();return Promise.resolve()}
  pending++;setSync('saving');
  var prev=pathChain[path]||Promise.resolve();
  var next=prev.then(function(){return limit(function(){return del?db.doc(path).delete():db.doc(path).set(data)})});
  pathChain[path]=next.catch(function(){});
  return next.then(function(){
    if(overlay[path]===token)delete overlay[path];
  },function(e){
    if(overlay[path]===token)delete overlay[path];
    setSync('error');writeError(e);
  }).then(function(){pending--;if(!pending){setSync('saved')}});
}
function putClient(id,d){return writeDoc('clients/'+id,false,d)}
function putTx(id,d){return writeDoc('txs/'+id,false,d)}
function dropTx(id){return writeDoc('txs/'+id,true)}
function dropClientDoc(id){return writeDoc('clients/'+id,true)}
function putSettings(){
  if(mode!=='db'){saveLocal();return Promise.resolve()}
  pending++;setSync('saving');
  var doc=Object.assign({},settings);
  var prev=pathChain['settings/main']||Promise.resolve();
  var next=prev.then(function(){return limit(function(){return db.doc('settings/main').set(doc)})});
  pathChain['settings/main']=next.catch(function(){});
  return next.catch(function(e){setSync('error');writeError(e)}).then(function(){pending--;if(!pending)setSync('saved')});
}
function afterChange(){rebuild();renderAll()}

/* ---------- boot ---------- */
function startLocal(){
  mode='local';
  try{
    var raw=localStorage.getItem('ledger-v2');
    if(raw){
      var d=JSON.parse(raw);
      Object.keys(d.c||{}).forEach(function(id){var c=normClient(d.c[id]);if(c)cdocs[id]=c});
      Object.keys(d.t||{}).forEach(function(id){var t=normTx(d.t[id]);if(t)tdocs[id]=t});
      settings=normSettings(d.s);
    }
  }catch(e){}
  loaded=true;rebuild();renderAll();
}
function startDb(){
  var got={c:0,t:0,s:0};
  var timer=setTimeout(function(){
    if(!loaded){loaded=true;$('#banner').innerHTML='<div class="banner">تعذر الوصول إلى البيانات المحفوظة حتى الآن. ستظهر عند عودة الاتصال.</div>';renderAll()}
  },10000);
  function mark(k,fromCache){
    if(fromCache)return;
    got[k]=1;
    if(got.c&&got.t&&got.s&&!loaded){loaded=true;clearTimeout(timer);$('#banner').innerHTML='';renderAll();autoBackup()}
  }
  function onErr(){clearTimeout(timer);loaded=true;$('#banner').innerHTML='<div class="banner">انقطع الاتصال بالتخزين. أعد فتح الصفحة لمتابعة الحفظ.</div>';renderAll()}
  db.collection('clients').onSnapshot(function(snap){
    var m={};snap.docs.forEach(function(d){var c=normClient(d.data());if(c)m[d.id]=c});
    cdocs=m;applyOverlay();rebuild();mark('c',snap.metadata.fromCache);renderAll();
  },onErr);
  db.collection('txs').onSnapshot(function(snap){
    var m={};snap.docs.forEach(function(d){var t=normTx(d.data());if(t)m[d.id]=t});
    tdocs=m;applyOverlay();rebuild();mark('t',snap.metadata.fromCache);renderAll();
  },onErr);
  db.doc('settings/main').onSnapshot(function(snap){
    if(snap.exists)settings=normSettings(snap.data());
    mark('s',snap.metadata.fromCache);renderAll();
  },onErr);
}
function boot(){
  renderAll();
  var c=window.claude;
  if(!c||typeof c.use!=='function'){startLocal();return}
  Promise.all([c.use('db'),c.use('downloads')]).then(function(r){
    tools.downloads=r[1]||null;db=r[0];
    if(!db){startLocal();return}
    mode='db';startDb();
  }).catch(startLocal);
}

/* ---------- pin lock ---------- */
var unlockMem='', hiddenAt=0, fails=0, blockedUntil=0;
function pinSet(){return !!settings.pinHash}
function isUnlocked(){
  var v='';try{v=sessionStorage.getItem('ledger-unlock')||''}catch(e){}
  return (v||unlockMem)===settings.pinHash;
}
function setUnlocked(h){unlockMem=h;try{if(h)sessionStorage.setItem('ledger-unlock',h);else sessionStorage.removeItem('ledger-unlock')}catch(e){}}
function hashPin(pin,salt){
  var s=salt+':'+pin;
  if(window.crypto&&crypto.subtle&&window.TextEncoder){
    return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')});
  }
  var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;
  return Promise.resolve('f'+(h>>>0).toString(16));
}
function checkLock(){
  var lock=$('#lock'),form=$('#lockForm'),msg=$('#lockMsg');
  $('#bLock').hidden=!(loaded&&pinSet());
  if(!loaded){document.body.classList.add('locked');lock.hidden=false;form.hidden=true;msg.textContent='جارٍ تحميل البيانات…';return false}
  if(pinSet()&&!isUnlocked()){
    document.body.classList.add('locked');lock.hidden=false;form.hidden=false;msg.textContent='أدخل رمز الدخول';
    if(!lock._shown){lock._shown=true;setTimeout(function(){$('#pin').focus()},30)}
    return false;
  }
  document.body.classList.remove('locked');lock.hidden=true;lock._shown=false;
  return true;
}
$('#lockForm').addEventListener('submit',function(e){
  e.preventDefault();
  var err=$('#lockErr'),pin=toDigits($('#pin').value).trim();
  if(Date.now()<blockedUntil){err.textContent='محاولات كثيرة. انتظر قليلاً ثم حاول مجدداً.';return}
  hashPin(pin,settings.pinSalt).then(function(h){
    if(h===settings.pinHash){fails=0;err.textContent='';$('#pin').value='';setUnlocked(h);renderAll()}
    else{fails++;$('#pin').value='';err.textContent='الرمز غير صحيح.';if(fails>=5){blockedUntil=Date.now()+30000;fails=0;err.textContent='الرمز غير صحيح. انتظر 30 ثانية قبل المحاولة التالية.'}}
  });
});
$('#bLock').addEventListener('click',function(){setUnlocked('');stack.slice().forEach(closeOv);renderAll()});
document.addEventListener('visibilitychange',function(){
  if(document.hidden)hiddenAt=Date.now();
  else if(pinSet()&&hiddenAt&&Date.now()-hiddenAt>120000){setUnlocked('');stack.slice().forEach(closeOv);renderAll()}
});

/* ---------- modals ---------- */
var layer=$('#layer'), stack=[], toastT=null;
function toast(msg,act){
  var t=$('#toast');t.textContent='';
  var s=document.createElement('span');s.textContent=msg;t.appendChild(s);
  if(act){var b=document.createElement('button');b.type='button';b.className='tact';b.textContent=act.label;b.addEventListener('click',function(){t.classList.remove('on');act.fn()});t.appendChild(b)}
  t.classList.toggle('act',!!act);t.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},act?8000:2600);
}
function openModal(html,cls){
  var ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML='<div class="modal '+(cls||'')+'" role="dialog" aria-modal="true" tabindex="-1">'+html+'</div>';
  ov._prev=document.activeElement;
  layer.appendChild(ov);stack.push(ov);
  ov.addEventListener('mousedown',function(e){if(e.target===ov)closeOv(ov)});
  var m=ov.firstElementChild,f=m.querySelector('[data-first]')||m.querySelector('input:not([type=radio]),textarea,button');
  (f||m).focus();
  return {ov:ov,m:m};
}
function closeOv(ov){
  var i=stack.indexOf(ov);if(i>=0)stack.splice(i,1);
  ov.remove();
  if(ov._onClose)ov._onClose();
  if(ov._prev&&ov._prev.focus&&document.contains(ov._prev))ov._prev.focus();
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&stack.length)closeOv(stack[stack.length-1])});
layer.addEventListener('click',function(e){
  var b=e.target.closest('[data-close]');
  if(b){var ov=b.closest('.overlay');if(ov)closeOv(ov)}
});
function confirmBox(msg,okLabel,danger){
  return new Promise(function(res){
    var answered=false;
    var o=openModal('<div class="mhead"><h3>تأكيد</h3><button class="x" type="button" data-close aria-label="إغلاق">×</button></div><p style="margin:0">'+msg+'</p><div class="foot"><button class="btn '+(danger?'danger':'solid')+'" type="button" data-yes data-first>'+esc(okLabel||'تأكيد')+'</button><button class="btn" type="button" data-close>إلغاء</button></div>');
    o.ov._onClose=function(){res(answered)};
    o.m.querySelector('[data-yes]').addEventListener('click',function(){answered=true;closeOv(o.ov)});
  });
}

/* ---------- backups ---------- */
function snapshotData(){
  return {
    clients:state.clients.concat(state.trash).map(function(c){return {id:c.id,no:c.no,name:c.name,phone:c.phone,cur:c.cur,note:c.note,kind:c.kind,del:c.del||0,createdAt:c.createdAt,
      txs:c.txs.map(function(x){return {id:x.id,type:x.type,amount:x.amount,date:x.date,due:x.due,note:x.note,createdAt:x.createdAt}})}}),
    settings:{lateDays:settings.lateDays,warnDays:settings.warnDays,termDays:settings.termDays,dueMode:settings.dueMode,shop:settings.shop,country:settings.country,template:settings.template}
  };
}
/* accepts the current format and the first version's (client.dueDate, one document) */
function fromBackup(src){
  if(!src||!Array.isArray(src.clients))return null;
  var out={clients:[],settings:src.settings&&typeof src.settings==='object'?src.settings:null};
  src.clients.forEach(function(c,i){
    if(!c||typeof c.name!=='string'||!c.name)return;
    var id=String(c.id||uid()),txs=[];
    (Array.isArray(c.txs)?c.txs:[]).forEach(function(x){
      var amt=Math.round(Number(x&&x.amount));if(!isFinite(amt)||amt<=0)return;
      var type=x.type==='payment'?'payment':'debt';
      txs.push({id:String(x.id||uid()),d:{cid:id,type:type,amount:amt,date:validDate(x.date)?x.date:today(),due:type==='debt'?(validDate(x.due)?x.due:validDate(c.dueDate)?c.dueDate:''):'',note:String(x.note||''),createdAt:Number(x.createdAt)||Date.now()+txs.length}});
    });
    out.clients.push({id:id,d:{no:Number(c.no)||i+1,name:c.name,phone:String(c.phone||''),cur:c.cur==='USD'?'USD':'IQD',note:String(c.note||''),kind:c.kind==='supplier'?'supplier':'customer',del:Number(c.del)||0,createdAt:Number(c.createdAt)||Date.now()+i},txs:txs});
  });
  return out;
}
function applyRestore(inc){
  var ps=[];
  Object.keys(cdocs).forEach(function(id){ps.push(dropClientDoc(id))});
  Object.keys(tdocs).forEach(function(id){ps.push(dropTx(id))});
  inc.clients.forEach(function(c){ps.push(putClient(c.id,c.d));c.txs.forEach(function(x){ps.push(putTx(x.id,x.d))})});
  if(inc.settings){settings=normSettings(Object.assign({},inc.settings,{pinHash:settings.pinHash,pinSalt:settings.pinSalt}));ps.push(putSettings())}
  afterChange();
  return Promise.all(ps);
}
function autoBackup(){
  if(mode!=='db'||!state.clients.length)return;
  var t=today();
  db.doc('backups/d-'+t).get().then(function(snap){
    if(snap.exists)return;
    var json=JSON.stringify(snapshotData()),parts=[],i=0;
    while(i<json.length){var end=Math.min(i+100000,json.length);var cc=json.charCodeAt(end-1);if(end<json.length&&cc>=0xD800&&cc<=0xDBFF)end--;parts.push(json.slice(i,end));i=end}
    var chain=Promise.resolve();
    parts.forEach(function(p,n){chain=chain.then(function(){return db.doc('backups/p-'+t+'-'+n).set({d:p})})});
    return chain.then(function(){return db.doc('backups/d-'+t).set({date:t,parts:parts.length,clients:state.clients.length,createdAt:Date.now()})}).then(pruneBackups);
  }).catch(function(){});
}
function pruneBackups(){
  return db.collection('backups').get().then(function(snap){
    var metas=snap.docs.filter(function(d){return d.id.indexOf('d-')===0}).sort(function(a,b){return a.id<b.id?1:-1});
    var chain=Promise.resolve();
    metas.slice(7).forEach(function(d){
      var date=d.id.slice(2),n=Number(d.data().parts)||0;
      for(var i=0;i<n;i++)(function(i){chain=chain.then(function(){return db.doc('backups/p-'+date+'-'+i).delete()})})(i);
      chain=chain.then(function(){return d.id&&db.doc('backups/'+d.id).delete()});
    });
    return chain;
  });
}
function listAutoBackups(el,ov){
  db.collection('backups').get().then(function(snap){
    if(!el.isConnected)return;
    var metas=snap.docs.filter(function(d){return d.id.indexOf('d-')===0}).sort(function(a,b){return a.id<b.id?1:-1}).slice(0,7);
    if(!metas.length){el.textContent='لا توجد نسخ تلقائية بعد. تُنشأ نسخة يومياً عند فتح التطبيق.';return}
    el.className='wlist';
    el.innerHTML=metas.map(function(d){var x=d.data();return '<div class="wrow"><div class="n">'+showD(x.date)+'<small>'+x.clients+' عميل</small></div><button class="btn" type="button" data-rest="'+esc(x.date)+'" data-parts="'+Number(x.parts)+'">استعادة</button></div>'}).join('');
    el.querySelectorAll('[data-rest]').forEach(function(b){b.addEventListener('click',function(){
      var date=b.getAttribute('data-rest'),n=Number(b.getAttribute('data-parts'));
      confirmBox('استعادة نسخة <b>'+showD(date)+'</b>؟ ستُستبدل البيانات الحالية.','استعادة',true).then(function(ok){
        if(!ok)return;
        var ps=[];for(var i=0;i<n;i++)ps.push(db.doc('backups/p-'+date+'-'+i).get());
        Promise.all(ps).then(function(r){
          var json=r.map(function(s){return s.exists?s.data().d:''}).join(''),inc;
          try{inc=fromBackup(JSON.parse(json))}catch(e){inc=null}
          if(!inc){toast('تعذرت قراءة النسخة');return}
          applyRestore(inc).then(function(){toast('تمت استعادة النسخة');closeOv(ov)});
        }).catch(function(){toast('تعذر تحميل النسخة')});
      });
    })});
  }).catch(function(){if(el.isConnected)el.textContent='تعذر تحميل قائمة النسخ.'});
}

function saveFile(name,data,label){
  var d=tools.downloads;
  if(d&&typeof d.save==='function'){

function pdfFromJpegs(items){
  var enc=new TextEncoder(),chunks=[],pos=0,offs=[];
  function put(x){var u=typeof x==='string'?enc.encode(x):x;chunks.push(u);pos+=u.length}
  function begin(id){offs[id]=pos;put(id+' 0 obj\n')}
  put('%PDF-1.4\n');put(new Uint8Array([0x25,0xE2,0xE3,0xCF,0xD3,0x0A]));
  var n=items.length,total=2+3*n;
  begin(1);put('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  begin(2);put('<< /Type /Pages /Count '+n+' /Kids ['+items.map(function(_,i){return (3+3*i)+' 0 R'}).join(' ')+'] >>\nendobj\n');
  items.forEach(function(it,i){
    var pid=3+3*i,cid=pid+1,iid=pid+2,cs='q 595 0 0 842 0 0 cm /Im0 Do Q';
    begin(pid);put('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 '+iid+' 0 R >> >> /Contents '+cid+' 0 R >>\nendobj\n');
    begin(cid);put('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream\nendobj\n');
    begin(iid);put('<< /Type /XObject /Subtype /Image /Width '+it.w+' /Height '+it.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+it.bytes.length+' >>\nstream\n');
    put(it.bytes);put('\nendstream\nendobj\n');
  });
  var xr=pos;put('xref\n0 '+(total+1)+'\n0000000000 65535 f \n');
  for(var id=1;id<=total;id++)put(String(offs[id]).padStart(10,'0')+' 00000 n \n');
  put('trailer\n<< /Size '+(total+1)+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF\n');
  return new Blob(chunks,{type:'application/pdf'});
}

function openVoice(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  var o=openModal('<div class="mhead"><div><h3>🎤 أمر صوتي</h3><small>قل مثلاً: «اكتب دين ٥٠ ألف على علاء» أو «سد ٢٠ ألف من علاء»</small></div><button class="x" type="button" data-close aria-label="إغلاق">×</button></div>'+
    '<div class="sec"><div style="display:flex;gap:10px;align-items:center">'+
      '<button class="btn good" type="button" id="vMic" style="min-width:120px"'+(SR?'':' disabled')+'>🎤 تكلّم</button>'+
      '<div id="vSt" class="msgbox" style="flex:1;min-height:44px">'+(SR?'اضغط تكلّم ثم قل الأمر.':'التعرف على الصوت غير متاح هنا. اضغط على الكتابة بالأسفل واستخدم ميكروفون لوحة المفاتيح 🎤.')+'</div></div>'+
      '<label class="field">النص<textarea class="inp" id="vTxt" rows="2" placeholder="اكتب أو أملِ الأمر هنا"></textarea></label>'+
      '<div id="vRes"></div><div class="err" id="vErr" role="alert"></div>'+
    '</div>');
  var m=o.m,txt=m.querySelector('#vTxt'),st=m.querySelector('#vSt'),res=m.querySelector('#vRes'),err=m.querySelector('#vErr'),mic=m.querySelector('#vMic'),cmd=null,listening=false;
  function stop(){try{recog&&recog.stop()}catch(e){}listening=false;mic.textContent='🎤 تكلّم'}
  var obs=new MutationObserver(function(){if(!document.body.contains(m)){stop();obs.disconnect()}});obs.observe(document.body,{childList:true,subtree:true});
  function analyse(){
    err.textContent='';cmd=null;res.innerHTML='';
    var s=txt.value.trim();if(!s)return;
    var kind=detectKind(s),pr=parseSpoken(s),c=matchClient(pr.tokens,pr.used);
    var gn=c?'':guessName(pr.tokens,pr.used);var opts='<option value="">— اختر العميل —</option>'+(gn?'<option value="__new" selected>➕ عميل جديد: '+esc(gn)+'</option>':'')+state.clients.map(function(x){return '<option value="'+esc(x.id)+'"'+(c&&c.id===x.id?' selected':'')+'>'+esc(x.name)+'</option>'}).join('');
    res.innerHTML='<div class="sec"><div class="grid2">'+
      '<label class="field">العملية<select class="inp" id="vKind"><option value="debt"'+(kind==='debt'?' selected':'')+'>دين جديد</option><option value="payment"'+(kind==='payment'?' selected':'')+'>تسديد دفعة</option></select></label>'+
      '<label class="field">العميل<select class="inp" id="vCl">'+opts+'</select></label>'+
      '<label class="field">المبلغ<input class="inp" id="vAmt" name="amount" inputmode="numeric" value="'+(pr.amount>0?money(pr.amount):'')+'"></label>'+
      '<label class="field">ملاحظة<input class="inp" id="vNote"></label></div>'+
      '<div class="msgbox">سمعتُ: «'+esc(s)+'»'+(c?'':' — لم أتعرف على اسم العميل، اخترْه من القائمة.')+(pr.amount>0?'':' — لم أجد المبلغ، اكتبه.')+'</div>'+
      '<div class="foot"><button class="btn solid" type="button" id="vSave">تأكيد وحفظ</button></div></div>';
    m.querySelector('#vSave').addEventListener('click',save);
  }
  function save(){
    var k=m.querySelector('#vKind').value,cid=m.querySelector('#vCl').value,a=parseAmt(m.querySelector('#vAmt').value),cl=getClient(cid);
    if(cid==='__new'){var nn=guessName(nz(txt.value).split(/\s+/).filter(Boolean),parseSpoken(txt.value).used),nid=uid();if(!nn){err.textContent='اختر العميل.';return}
      var mx=nextNo()-1;
      var orig=txt.value.trim().split(/\s+/),gw=nn.split(' '),oi,oj,fnd=null;for(oi=0;oi<orig.length&&!fnd;oi++){for(oj=0;oj<gw.length;oj++){if(nz(orig[oi+oj]||'')!==gw[oj])break}if(oj===gw.length)fnd=orig.slice(oi,oi+gw.length).join(' ')}if(fnd)nn=fnd;
      putClient(nid,{no:mx+1,name:nn,phone:'',cur:'IQD',note:'',kind:ui.tab==='suppliers'?'supplier':'customer',createdAt:Date.now()});toast('أُضيف عميل جديد: '+nn);
      cl={id:nid,name:nn,cur:'IQD'};
      if(k==='payment'){err.textContent='العميل جديد ولا يوجد عليه دين.';return}}
    if(!cl){err.textContent='اختر العميل.';return}
    if(!(a>0)){err.textContent='المبلغ غير صحيح.';return}
    var note=m.querySelector('#vNote').value.trim();
    if(k==='payment'){
      var kk=calc(cl);
      if(a>kk.rem){err.textContent='المبلغ أكبر من المتبقي ('+fm(kk.rem,cl.cur)+').';return}
      putTx(uid(),{cid:cl.id,type:'payment',amount:a,date:today(),due:'',note:note,createdAt:Date.now()});
      toast('تم تسجيل دفعة '+fm(a,cl.cur)+' من '+cl.name);
    }else{
      putTx(uid(),{cid:cl.id,type:'debt',amount:a,date:today(),due:addDays(today(),S().termDays),note:note,createdAt:Date.now()});
      toast('تمت إضافة دين '+fm(a,cl.cur)+' على '+cl.name);
    }
    afterChange();stop();closeOv(o.ov);
  }
  var tm=null;txt.addEventListener('input',function(){clearTimeout(tm);tm=setTimeout(analyse,350)});
  if(SR)mic.addEventListener('click',function(){
    if(listening){stop();return}
    try{
      recog=new SR();recog.lang='ar-IQ';recog.interimResults=true;recog.continuous=false;
      recog.onresult=function(e){var s='';for(var i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;txt.value=s;analyse();if(e.results[e.results.length-1].isFinal){try{recog.stop()}catch(x){}}};
      recog.onerror=function(e){listening=false;mic.textContent='🎤 تكلّم';st.textContent=(e.error==='not-allowed'||e.error==='service-not-allowed')?'الميكروفون غير مسموح هنا. اكتب الأمر أو استخدم ميكروفون لوحة المفاتيح.':e.error==='no-speech'?'لم أسمع شيئاً، حاول مرة ثانية.':'تعذر التعرف على الصوت ('+e.error+'). اكتب الأمر.'};
      recog.onend=function(){listening=false;mic.textContent='🎤 تكلّم';if(txt.value.trim())analyse()};
      recog.start();listening=true;mic.textContent='⏹ إيقاف';st.textContent='أسمعك… تكلّم الآن.';
    }catch(e){st.textContent='تعذر تشغيل الميكروفون. اكتب الأمر.'}
  });
  m.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'&&m.querySelector('#vSave')){e.preventDefault();save()}});
  if(SR)setTimeout(function(){if(!listening)mic.click()},50);else txt.focus();
}

  if(act==='del'){delClient(id);return}
  if(act==='view')openClient(id);else if(act==='pay')openPay(id);else if(act==='debt')openDebt(id);
});

/* amount fields: group digits with commas while typing (10,000 / 100,000) */
function fmtMoney(el){
  var v=el.value,pos=el.selectionStart==null?v.length:el.selectionStart;
  var before=toDigits(v.slice(0,pos)).replace(/\D/g,'').length;
  var d=toDigits(v).replace(/\D/g,'').slice(0,13).replace(/^0+(?=\d)/,'');
  var nv=d?Number(d).toLocaleString('en-US'):'';
  el.value=nv;
  var c=0,i=0;
  while(i<nv.length&&c<before){if(/\d/.test(nv.charAt(i)))c++;i++}
  try{el.setSelectionRange(i,i)}catch(e){}
}
layer.addEventListener('input',function(e){var t=e.target;if(t&&t.tagName==='INPUT'&&t.name==='amount')fmtMoney(t)});
var menu=$('#menu'),bMore=$('#bMore');
function closeMenu(){menu.hidden=true;bMore.setAttribute('aria-expanded','false')}
bMore.addEventListener('click',function(e){
  e.stopPropagation();
  if(!menu.hidden){closeMenu();return}
  menu.hidden=false;bMore.setAttribute('aria-expanded','true');
  var r=bMore.getBoundingClientRect(),w=menu.offsetWidth;
  menu.style.top=(r.bottom+6)+'px';menu.style.left=Math.min(Math.max(8,r.left),window.innerWidth-w-8)+'px';
  var first=menu.querySelector('button');if(first)first.focus();
});
document.addEventListener('click',function(e){if(!menu.hidden&&!menu.contains(e.target))closeMenu()});
menu.addEventListener('click',function(e){if(e.target.closest('button'))closeMenu()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!menu.hidden){closeMenu();bMore.focus()}});

boot();
